# 公开仓库的最小校验：零第三方依赖，所以不需要安装任何包。
# 注意：这里刻意不含任何"覆盖率徽章"式的 owner/repo 硬编码 —— 见 AGENTS.md R3。
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: 运行单元测试
        run: PYTHONPATH=src uv run --python 3.12 python -m unittest discover -s tests -v
